<!DOCTYPE html>
<html>
<head>
    <title>Appointments</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <span class="navbar-brand">Appointments</span>
        <a href="/" class="btn btn-outline-light btn-sm">Dashboard</a>
    </div>
</nav>

<div class="container mt-4">

    <div class="card shadow">
        <div class="card-header bg-danger text-white">
            Appointments List
        </div>

        <div class="card-body p-0">
            <table class="table table-striped mb-0">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Client</th>
                        <th>Service</th>
                        <th>Staff</th>
                        <th>Date</th>
                        <th>Time</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    {% for a in appointments %}
                    <tr>
                        <td>{{ forloop.counter }}</td>
                        <td>{{ a.client }}</td>
                        <td>{{ a.service }}</td>
                        <td>{{ a.staff }}</td>
                        <td>{{ a.date }}</td>
                        <td>{{ a.time }}</td>
                        <td>
                            <span class="badge
                                {% if a.status == 'Completed' %} bg-success
                                {% elif a.status == 'Cancelled' %} bg-danger
                                {% else %} bg-warning {% endif %}">
                                {{ a.status }}
                            </span>
                        </td>
                        <td>
                            <a href="/appointments/edit/{{ a.id }}/"
                               class="btn btn-sm btn-primary">Edit</a>
                            <a href="/appointments/delete/{{ a.id }}/"
                               class="btn btn-sm btn-danger"
                               onclick="return confirm('Delete this appointment?');">
                               Delete
                            </a>
                        </td>
                    </tr>
                    {% empty %}
                    <tr>
                        <td colspan="8" class="text-center text-muted">
                            No appointments found
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>

    </div>

</div>

</body>
</html>
