<!DOCTYPE html>
<html>
<head>
    <title>Book Appointment</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">
    <div class="card shadow border-0 rounded-4">
        <div class="card-body p-4">

            <div class="d-flex justify-content-between align-items-center mb-3">
                <h4 class="fw-bold">Book Appointment</h4>
                <a href="/" class="btn btn-outline-dark btn-sm">Dashboard</a>
            </div>

            <form method="post">
                {% csrf_token %}

                <div class="mb-3">
                    <label class="form-label">Client</label>
                    <select name="client" class="form-select" required>
                        <option value="">Select client</option>
                        {% for c in clients %}
                            <option value="{{ c.id }}">{{ c.name }} - {{ c.phone }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Service</label>
                    <select name="service" class="form-select" required>
                        <option value="">Select service</option>
                        {% for s in services %}
                            <option value="{{ s.id }}">{{ s.name }} - KES {{ s.price }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Staff</label>
                    <select name="staff" class="form-select" required>
                        <option value="">Select staff</option>
                        {% for s in staff %}
                            <option value="{{ s.id }}">{{ s.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                
                <div class="mb-3">
                    <label class="form-label">Payment Method</label>
                    <select name="payment_method" class="form-select" required>
                        <option value="Cash">Cash</option>
                        <option value="M-Pesa">M-Pesa</option>
                        <option value="Bank">Bank</option>
                    </select>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Date</label>
                        <input type="date" name="date" class="form-control" required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Time</label>
                        <input type="time" name="time" class="form-control" required>
                    </div>
                </div>

                <button class="btn btn-dark w-100 rounded-pill">Save Appointment</button>
            </form>

        </div>
    </div>
</div>

</body>
</html>
