```html id="aq71mr"
{% extends 'base.html' %}

{% block content %}

<div class="container py-4">

    <div class="card shadow-sm border-0 rounded-4">

        <div class="card-body">

            <h4 class="mb-4">
                Edit Completed Quick Task
            </h4>

            <form method="POST">
                {% csrf_token %}


                <div class="mb-3">

                    <label class="form-label">
                        Task
                    </label>

                    <input
                        type="text"
                        name="task_name"
                        class="form-control"
                        value="{{ task.task_name }}"
                        required
                    >

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Client Name
                    </label>

                    <input
                        type="text"
                        name="client_name"
                        class="form-control"
                        value="{{ task.client_name|default:'' }}"
                    >

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Client Phone
                    </label>

                    <input
                        type="text"
                        name="client_phone"
                        class="form-control"
                        value="{{ task.client_phone|default:'' }}"
                    >

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Sale Amount
                    </label>

                    <div class="input-group">

                        <span class="input-group-text">
                            KES
                        </span>

                        <input
                            type="number"
                            step="0.01"
                            min="0"
                            name="sale_amount"
                            class="form-control"
                            value="{{ task.sale_amount }}"
                            required
                        >

                    </div>

                </div>


                <hr>


                <h5 class="mb-3">
                    Staff Commission
                </h5>

                {% for commission in commissions %}

                    <div class="mb-3">

                        <label class="form-label">

                            {{ commission.staff.name }}

                        </label>

                        <div class="input-group">

                            <span class="input-group-text">
                                KES
                            </span>

                            <input
                                type="number"
                                step="0.01"
                                min="0"
                                name="commission_{{ commission.id }}"
                                value="{{ commission.commission_amount }}"
                                class="form-control"
                            >

                        </div>

                    </div>

                {% empty %}

                    <div class="alert alert-warning">

                        No staff commission is assigned to this task.

                    </div>

                {% endfor %}


                <div class="d-flex gap-2 mt-4">

                    <button
                        type="submit"
                        class="btn btn-primary"
                    >
                        Save Changes
                    </button>

                    <a
                        href="{% url 'staff_work_history' %}"
                        class="btn btn-secondary"
                    >
                        Cancel
                    </a>

                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}
```
