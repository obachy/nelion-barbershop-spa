<!DOCTYPE html>
<html>
<head>
    <title>Edit Appointment</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">
    <div class="card shadow border-0 rounded-4">
        <div class="card-body p-4">

            <div class="d-flex justify-content-between align-items-center mb-3">
                <h4 class="fw-bold">Edit Appointment</h4>
                <a href="/appointments/" class="btn btn-outline-dark btn-sm">Back</a>
            </div>

            <form method="post">
                {% csrf_token %}

                <div class="mb-3">
                    <label class="form-label">Client</label>
                    <select name="client" class="form-select" required>
                        {% for c in clients %}
                            <option value="{{ c.id }}" {% if appointment.client.id == c.id %}selected{% endif %}>
                                {{ c.name }} - {{ c.phone }}
                            </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Service</label>
                    <select name="service" class="form-select" required>
                        {% for s in services %}
                            <option value="{{ s.id }}" {% if appointment.service.id == s.id %}selected{% endif %}>
                                {{ s.name }} - KES {{ s.price }}
                            </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Staff</label>
                    <select name="staff" class="form-select" required>
                        {% for s in staff %}
                            <option value="{{ s.id }}" {% if appointment.staff.id == s.id %}selected{% endif %}>
                                {{ s.name }}
                            </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Date</label>
                        <input type="date" name="date" value="{{ appointment.date|date:'Y-m-d' }}" class="form-control" required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Time</label>
                        <input type="time" name="time" value="{{ appointment.time|time:'H:i' }}" class="form-control" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Payment Method</label>
                    <select name="payment_method" class="form-select" required>
                        <option value="Cash" {% if appointment.payment_method == "Cash" %}selected{% endif %}>Cash</option>
                        <option value="M-Pesa" {% if appointment.payment_method == "M-Pesa" %}selected{% endif %}>M-Pesa</option>
                        <option value="Bank" {% if appointment.payment_method == "Bank" %}selected{% endif %}>Bank</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Status</label>
                    <select name="status" class="form-select">
                        <option value="Pending" {% if appointment.status == "Pending" %}selected{% endif %}>Pending</option>
                        <option value="Completed" {% if appointment.status == "Completed" %}selected{% endif %}>Completed</option>
                        <option value="Cancelled" {% if appointment.status == "Cancelled" %}selected{% endif %}>Cancelled</option>
                    </select>
                </div>

                <button class="btn btn-dark w-100 rounded-pill">Save Changes</button>
            </form>

        </div>
    </div>
</div>

</body>
</html>
