<!DOCTYPE html>
<html>
<head>
    <title>Walk-in Customer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f4f6f9;
        }

        .page-card {
            border: none;
            border-radius: 22px;
        }

        .form-control, .form-select {
            border-radius: 12px;
            padding: 12px;
        }

        .top-bar {
            background: #111827;
            border-radius: 0 0 22px 22px;
        }

        .section-title {
            font-size: 13px;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: .08em;
            font-weight: 700;
        }
    </style>
</head>

<body>

<div class="top-bar text-white py-4 mb-4">
    <div class="container d-flex justify-content-between align-items-center">
        <div>
            <h3 class="mb-0 fw-bold">Walk-in Customer</h3>
            <small class="text-white-50">Quickly create today’s appointment for a physical customer</small>
        </div>

        <a href="/" class="btn btn-outline-light rounded-pill px-4">Dashboard</a>
    </div>
</div>

<div class="container mb-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">

            <div class="card page-card shadow-sm">
                <div class="card-body p-4 p-md-5">

                    <form method="post">
                        {% csrf_token %}

                        <p class="section-title mb-3">Customer Details</p>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-semibold">Customer Name</label>
                                <input type="text" name="name" class="form-control" placeholder="Customer name" required>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-semibold">Phone Number</label>
                                <input type="text" name="phone" class="form-control" placeholder="07..." required>
                            </div>
                        </div>

                        <p class="section-title mt-4 mb-3">Appointment Details</p>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Select Service</label>
                            <select name="service" class="form-select" required>
                                <option value="">Choose service</option>
                                {% for s in services %}
                                    <option value="{{ s.id }}">
                                        {{ s.name }} - KES {{ s.price }} - {{ s.duration }} mins - {{ s.commission_percent }}% / KES {{ s.commission_amount }} commission
                                    </option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Select Staff</label>
                            <select name="staff" class="form-select" required>
                                <option value="">Choose staff</option>
                                {% for s in staff %}
                                    <option value="{{ s.id }}">{{ s.name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                         
                        <div class="mb-3">
                            <label class="form-label">Payment Method</label>
                            <select name="payment_method" class="form-select" required>
                                <option value="Cash">Cash</option>
                                <option value="M-Pesa">M-Pesa</option>
                                <option value="Bank">Bank</option>
                            </select>
                        </div>

                        <div class="alert alert-info rounded-4">
                            This will create an appointment for today automatically.
                        </div>

                        <div class="d-flex gap-2 mt-4">
                            <button class="btn btn-dark rounded-pill px-4">
                                Save Walk-in
                            </button>

                            <a href="/appointments/" class="btn btn-outline-secondary rounded-pill px-4">
                                Cancel
                            </a>
                        </div>

                    </form>

                </div>
            </div>

        </div>
    </div>
</div>

</body>
</html>
