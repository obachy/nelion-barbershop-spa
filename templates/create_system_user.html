{% extends "base.html" %}

{% block title %}Add User - Buzz Cloud{% endblock %}

{% block content %}

<div class="d-flex justify-content-between align-items-center mb-4">
    <div>
        <h3 class="fw-bold mb-0">Add System User</h3>
        <small class="text-muted">Create admin or staff login account</small>
    </div>
    <a href="/users/" class="btn btn-outline-dark rounded-pill px-4">Back to Users</a>
</div>

{% if messages %}
    {% for message in messages %}
        <div class="alert alert-info">{{ message }}</div>
    {% endfor %}
{% endif %}

<div class="row">
    <div class="col-lg-6">
        <div class="card shadow-sm border-0 rounded-4">
            <div class="card-body p-4">

                <form method="post">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Username</label>
                        <input type="text" name="username" class="form-control" placeholder="Example: mary or 0712345678" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Role</label>
                        <select name="role" class="form-select" required>
                            <option value="">Select Role</option>
                            <option value="Admin">Admin</option>
                            <option value="Staff">Staff</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Password</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-semibold">Confirm Password</label>
                        <input type="password" name="confirm_password" class="form-control" required>
                    </div>

                    <button type="submit" class="btn btn-dark rounded-pill px-4">
                        Save User
                    </button>

                    <a href="/users/" class="btn btn-outline-secondary rounded-pill px-4 ms-2">
                        Cancel
                    </a>
                </form>

            </div>
        </div>
    </div>
</div>

{% endblock %}
