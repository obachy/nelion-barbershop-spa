{% extends "base.html" %}

{% block title %}Create Invoice - Buzz Cloud{% endblock %}

{% block content %}

<div class="d-flex justify-content-between align-items-center mb-4">
    <div>
        <h3 class="fw-bold mb-0">Create Invoice</h3>
        <small class="text-muted">Add client invoice and invoice items</small>
    </div>

    <a href="/invoices/" class="btn btn-outline-dark rounded-pill px-4">
        View Invoices
    </a>
</div>

<div class="card shadow-sm border-0 rounded-4">
    <div class="card-body p-4">

        <form method="post">
            {% csrf_token %}

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label fw-semibold">Client</label>
                    <select name="client" class="form-select" required>
                        <option value="">Select client</option>
                        {% for client in clients %}
                            <option value="{{ client.id }}">{{ client.name }} - {{ client.phone }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="col-md-3 mb-3">
                    <label class="form-label fw-semibold">Invoice Date</label>
                    <input type="date" name="invoice_date" class="form-control" required>
                </div>

                <div class="col-md-3 mb-3">
                    <label class="form-label fw-semibold">Due Date</label>
                    <input type="date" name="due_date" class="form-control">
                </div>

                <div class="col-md-4 mb-3">
                    <label class="form-label fw-semibold">Status</label>
                    <select name="status" class="form-select">
                        <option value="Unpaid">Unpaid</option>
                        <option value="Paid">Paid</option>
                    </select>
                </div>
            </div>

            <hr>

            <h6 class="fw-bold mb-3">Invoice Items</h6>

            <div id="invoiceItems">
                <div class="row invoice-item mb-2">
                    <div class="col-md-6 mb-2">
                        <input type="text" name="description" class="form-control" placeholder="Item / service description" required>
                    </div>

                    <div class="col-md-2 mb-2">
                        <input type="number" name="quantity" class="form-control" placeholder="Qty" min="1" step="0.01" value="1" required>
                    </div>

                    <div class="col-md-3 mb-2">
                        <input type="number" name="unit_price" class="form-control" placeholder="Unit price" min="0" step="0.01" required>
                    </div>

                    <div class="col-md-1 mb-2">
                        <button type="button" class="btn btn-danger w-100" onclick="removeItem(this)">X</button>
                    </div>
                </div>
            </div>

            <button type="button" class="btn btn-outline-dark rounded-pill mt-2" onclick="addItem()">
                + Add Item
            </button>

            <div class="mb-4 mt-4">
                <label class="form-label fw-semibold">Notes</label>
                <textarea name="notes" class="form-control" rows="3" placeholder="Optional notes"></textarea>
            </div>

            <button type="submit" class="btn btn-dark rounded-pill px-4">
                Save Invoice
            </button>

            <a href="/invoices/" class="btn btn-outline-secondary rounded-pill px-4 ms-2">
                Cancel
            </a>
        </form>

    </div>
</div>

<script>
    function addItem() {
        const container = document.getElementById('invoiceItems');

        const row = document.createElement('div');
        row.className = 'row invoice-item mb-2';

        row.innerHTML = `
            <div class="col-md-6 mb-2">
                <input type="text" name="description" class="form-control" placeholder="Item / service description" required>
            </div>

            <div class="col-md-2 mb-2">
                <input type="number" name="quantity" class="form-control" placeholder="Qty" min="1" step="0.01" value="1" required>
            </div>

            <div class="col-md-3 mb-2">
                <input type="number" name="unit_price" class="form-control" placeholder="Unit price" min="0" step="0.01" required>
            </div>

            <div class="col-md-1 mb-2">
                <button type="button" class="btn btn-danger w-100" onclick="removeItem(this)">X</button>
            </div>
        `;

        container.appendChild(row);
    }

    function removeItem(button) {
        const rows = document.querySelectorAll('.invoice-item');

        if (rows.length > 1) {
            button.closest('.invoice-item').remove();
        }
    }
</script>

{% endblock %}
