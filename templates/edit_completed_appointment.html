```html
{% extends 'base.html' %}

{% block content %}

<div class="container py-4">

    <div class="card shadow-sm">

        <div class="card-body">

            <h4 class="mb-4">
                Edit Completed Appointment
            </h4>

            <form method="POST">
                {% csrf_token %}

                <div class="mb-3">

                    <label class="form-label">
                        Staff
                    </label>

                    <select
                        name="staff"
                        class="form-select"
                        required
                    >
                        {% for staff in staff_list %}

                            <option
                                value="{{ staff.id }}"
                                {% if appointment.staff.id == staff.id %}
                                    selected
                                {% endif %}
                            >
                                {{ staff.name }}
                            </option>

                        {% endfor %}
                    </select>

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Service
                    </label>

                    <select
                        name="service"
                        class="form-select"
                        required
                    >
                        {% for service in services %}

                            <option
                                value="{{ service.id }}"
                                {% if appointment.service.id == service.id %}
                                    selected
                                {% endif %}
                            >
                                {{ service.name }} -
                                KES {{ service.price|floatformat:2 }}
                            </option>

                        {% endfor %}
                    </select>

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Date
                    </label>

                    <input
                        type="date"
                        name="date"
                        value="{{ appointment.date|date:'Y-m-d' }}"
                        class="form-control"
                        required
                    >

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Time
                    </label>

                    <input
                        type="time"
                        name="time"
                        value="{{ appointment.time|time:'H:i' }}"
                        class="form-control"
                        required
                    >

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Payment Method
                    </label>

                    <select
                        name="payment_method"
                        class="form-select"
                    >

                        <option
                            value="Cash"
                            {% if appointment.payment_method == 'Cash' %}
                                selected
                            {% endif %}
                        >
                            Cash
                        </option>

                        <option
                            value="M-Pesa"
                            {% if appointment.payment_method == 'M-Pesa' %}
                                selected
                            {% endif %}
                        >
                            M-Pesa
                        </option>

                        <option
                            value="Bank"
                            {% if appointment.payment_method == 'Bank' %}
                                selected
                            {% endif %}
                        >
                            Bank
                        </option>

                    </select>

                </div>


                <div class="d-flex gap-2">

                    <button
                        type="submit"
                        class="btn btn-primary"
                    >
                        Save Changes
                    </button>

                    <a
                        href="{% url 'staff_work_history' %}"
                        class="btn btn-secondary"
                    >
                        Cancel
                    </a>

                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}
```
