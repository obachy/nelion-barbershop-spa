{% extends "base.html" %}

{% block title %}Add Expense / Bill - Buzz Cloud{% endblock %}

{% block content %}

<div class="d-flex justify-content-between align-items-center mb-4">
    <div>
        <h3 class="fw-bold mb-0">Add Expense / Bill</h3>
        <small class="text-muted">Record salon expenses and bills</small>
    </div>

    <a href="/expenses/" class="btn btn-outline-dark rounded-pill px-4">
        View Expenses
    </a>
</div>

<div class="row">
    <div class="col-lg-7">
        <div class="card shadow-sm border-0 rounded-4">
            <div class="card-body p-4">

                <form method="post">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Type</label>
                        <select name="expense_type" class="form-select" required>
                            <option value="Expense">Expense</option>
                            <option value="Bill">Bill</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Title</label>
                        <input type="text" name="title" class="form-control" placeholder="Example: Rent, Tokens, Water, Stock purchase" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Amount</label>
                        <input type="number" name="amount" class="form-control" placeholder="Example: 2000" min="0" step="0.01" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Payment Method</label>
                        <select name="payment_method" class="form-select" required>
                            <option value="Cash">Cash</option>
                            <option value="M-Pesa">M-Pesa</option>
                            <option value="Bank">Bank</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Status</label>
                        <select name="status" class="form-select" required>
                            <option value="Paid">Paid</option>
                            <option value="Unpaid">Unpaid</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Expense/Bill Date</label>
                        <input type="date" name="expense_date" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Due Date</label>
                        <input type="date" name="due_date" class="form-control">
                        <small class="text-muted">Use this mostly for unpaid bills.</small>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-semibold">Notes</label>
                        <textarea name="notes" class="form-control" rows="3" placeholder="Optional notes"></textarea>
                    </div>

                    <button type="submit" class="btn btn-dark rounded-pill px-4">
                        Save
                    </button>

                    <a href="/expenses/" class="btn btn-outline-secondary rounded-pill px-4 ms-2">
                        Cancel
                    </a>
                </form>

            </div>
        </div>
    </div>
</div>

{% endblock %}
