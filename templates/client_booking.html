<!DOCTYPE html>
<html>
<head>
    <title>Book Appointment</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
<div class="row justify-content-center">
<div class="col-md-6">

<div class="card shadow">
<div class="card-header bg-primary text-white text-center">
    <h4>Book Appointment</h4>
</div>

<div class="card-body">
<form method="post">
{% csrf_token %}

<input type="text" name="name" placeholder="Your Name" class="form-control mb-2" required>
<input type="text" name="phone" placeholder="Phone" class="form-control mb-2" required>
<input type="email" name="email" placeholder="Email" class="form-control mb-2">

<select name="service" class="form-control mb-2" required>
<option value="">Select Service</option>
{% for s in services %}
<option value="{{ s.id }}">{{ s.name }} - KES {{ s.price }}</option>
{% endfor %}
</select>

<input type="date" name="date" id="date" class="form-control mb-2" required>
<input type="time" name="time" id="time" class="form-control mb-2" required>

<select name="staff" id="staff" class="form-control mb-3" required>
<option value="">Select Staff</option>
</select>

<button class="btn btn-success w-100">Book Appointment</button>

</form>
</div>
</div>

</div>
</div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function () {

const dateInput = document.getElementById('date');
const timeInput = document.getElementById('time');
const staffSelect = document.getElementById('staff');

function loadStaff() {
    const date = dateInput.value;
    const time = timeInput.value;

    if (!date || !time) return;

    fetch(`/ajax/available-staff/?date=${date}&time=${time}`)
    .then(response => response.json())
    .then(data => {
        staffSelect.innerHTML = '<option value="">Select Staff</option>';
        data.staff.forEach(s => {
            staffSelect.innerHTML += `<option value="${s.id}">${s.name}</option>`;
        });
    });
}

dateInput.addEventListener('change', loadStaff);
timeInput.addEventListener('change', loadStaff);

});
</script>

</body>
</html>
