<!DOCTYPE html>
<html>
<head>
    <title>Staff</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <span class="navbar-brand">Staff</span>
        <a href="/" class="btn btn-outline-light btn-sm">Dashboard</a>
    </div>
</nav>

<div class="container mt-4">
    <table class="table table-striped shadow">
        <thead>
            <tr>
                <th>#</th><th>Name</th><th>Phone</th><th>Commission</th>
            </tr>
        </thead>
        <tbody>
            {% for s in staff %}
            <tr>
                <td>{{ forloop.counter }}</td>
                <td>{{ s.name }}</td>
                <td>{{ s.phone }}</td>
                <td>{{ s.commission }}%</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>

</body>
</html>
